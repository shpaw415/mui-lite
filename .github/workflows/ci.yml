name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        env:
          RTL_SKIP_AUTO_CLEANUP: "true"
        run: bun test

      - name: Build library
        run: bun run build

      - name: Verify TypeScript declarations
        run: |
          set -euo pipefail
          test -f packages/mui-lite/dist/mui/Button/index.d.ts
          test -f packages/mui-lite/dist/common/theme/index.d.ts
          test -f packages/mui-lite/dist/style/mui-style.css
